[build-system]
requires = ["setuptools>=62", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "echotrace-whispering-objects"
version = "0.0.1"
description = "Scaffold for the EchoTrace – Whispering Objects installation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ethan Watrall" }]
dependencies = [
    "Flask>=2.2",
    "Jinja2>=3.1",
    "PyYAML>=6.0",
    "gpiozero>=1.6",
    "paho-mqtt>=1.6",
    "pygame>=2.5",
    "python-dotenv>=0.21.0",
    "schedule>=1.2",
    "typing-extensions>=4.0",
    "waitress>=2.1",
]

[project.optional-dependencies]
dev = [
    "flake8>=5.0.4",
    "mypy>=1.4.1",
    "pytest>=7.4.4",
    "ruff>=0.3",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["hub", "pi_nodes", "shared"]
explicit_package_bases = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "N", "S"]
ignore = ["S101", "S104", "S105", "UP006", "UP035", "UP045", "I001"]

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]
